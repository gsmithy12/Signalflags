<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marine Mastery - Main Menu</title>
    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --colregs-blue: #0ea5e9;
            /* Updated to a brightened version of the burgundy for readable text/borders */
            --signals-burgundy: #c23b6b; 
            /* The exact dark plum/burgundy from your image for the background glow */
            --signals-bg-glow: rgba(91, 42, 61, 0.6); 
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0f172a;
            /* Split Hue: Blue on Left, New Burgundy on Right */
            background-image: 
                radial-gradient(circle at 0% 50%, rgba(14, 165, 233, 0.25) 0%, transparent 60%), 
                radial-gradient(circle at 100% 50%, var(--signals-bg-glow) 0%, transparent 65%);
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 { 
            font-size: 3.5rem; 
            font-weight: 900;
            text-align: center; 
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 40px; font-size: 1.3rem; font-weight: 500;}

        .master-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 800px;
        }

        .module-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* COLREGs Button Hover */
        .module-btn.colregs:hover {
            transform: translateY(-5px);
            border-color: var(--colregs-blue);
            box-shadow: 0 10px 40px rgba(14, 165, 233, 0.3);
            background: rgba(14, 165, 233, 0.1);
        }

        /* Signals Button Hover */
        .module-btn.signals:hover {
            transform: translateY(-5px);
            border-color: var(--signals-burgundy);
            box-shadow: 0 10px 40px rgba(194, 59, 107, 0.2);
            background: rgba(194, 59, 107, 0.1);
        }

        .module-title { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
        .colregs .module-title { color: var(--colregs-blue); }
        .signals .module-title { color: var(--signals-burgundy); }
        .module-desc { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; }

        /* --- FLASHCARD FAN GRAPHIC --- */
        .btn-fan {
            display: flex; justify-content: center; align-items: flex-end;
            position: relative; height: 110px; width: 140px; flex-shrink: 0;
            margin-bottom: 10px;
        }
        .btn-fan img {
            position: absolute; width: 90px; height: 65px; border-radius: 6px;
            border: 2px solid #1e293b; box-shadow: 0 6px 12px rgba(0,0,0,0.6); object-fit: cover; background: #fff;
        }
        .btn-fan .left { transform: translateX(-40px) translateY(-10px) rotate(-15deg); z-index: 1; }
        .btn-fan .right { transform: translateX(40px) translateY(-10px) rotate(15deg); z-index: 1; }
        .btn-fan .center { transform: translateY(5px); width: 110px; height: 80px; z-index: 2; border-color: var(--colregs-blue); }

        /* --- NAUTICAL FLAGS GRAPHIC --- */
        .flag-cluster {
            display: flex; justify-content: center; align-items: flex-end;
            position: relative; height: 110px; width: 140px; flex-shrink: 0; margin-bottom: 10px;
        }
        .n-flag {
            position: absolute; width: 60px; height: 45px; border-radius: 4px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6); display: flex; overflow: hidden;
        }
        /* Tango Flag (Red/White/Blue vertical) */
        .flag-1 { transform: translateX(-35px) translateY(-20px) rotate(-10deg); z-index: 1; background: linear-gradient(90deg, #ef4444 33%, #ffffff 33%, #ffffff 66%, #3b82f6 66%); }
        /* Oscar Flag (Red/Yellow diagonal) */
        .flag-2 { transform: translateX(35px) translateY(-20px) rotate(10deg); z-index: 1; background: linear-gradient(135deg, #ef4444 50%, #facc15 50%); }
        /* Kilo Flag (Yellow/Blue vertical) */
        .flag-3 { transform: translateY(0px); width: 75px; height: 55px; z-index: 2; background: linear-gradient(90deg, #facc15 50%, #3b82f6 50%); border: 2px solid var(--signals-burgundy); }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .master-grid { grid-template-columns: 1fr; gap: 15px; }
            .module-btn { padding: 30px 15px; }
        }
    </style>
</head>
<body>

    <h1>Marine Mastery</h1>
    <div class="subtitle">Select your training module</div>

    <div class="master-grid">
        <!-- COLREGS APP LINK -->
        <a href="colregs.html" class="module-btn colregs">
            <div class="module-title">COLREGs</div>
            <div class="module-desc">Rules of the Road & Situations</div>
            
            <div class="btn-fan">
                <img src="images/24.png" class="left" alt="Card">
                <img src="images/27.png" class="right" alt="Card">
                <img src="images/19.png" class="center" alt="Card">
            </div>
        </a>

        <!-- SIGNALS APP LINK -->
        <a href="signals.html" class="module-btn signals">
            <div class="module-title">Signals</div>
            <div class="module-desc">Flags, Morse Code & Prosigns</div>
            
            <div class="flag-cluster">
                <div class="n-flag flag-1"></div>
                <div class="n-flag flag-2"></div>
                <div class="n-flag flag-3"></div>
            </div>
        </a>
    </div>

</body>
</html>
